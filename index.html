<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Instagram Clone</title>
</head>
<body>
    <header class="section-padding">
        <div class="container flex-horizontal header-container">
            <img src="images/logo.png" alt="oldagram logo" class="logo">
            <div class="profile">
                <img src="images/user-avatar.png" alt="user avatar" class="round-img">
            </div>
        </div>
    </header>
    <main class="section-padding">
        <div class="container">
            <div class="post flex-vertical">
                <div class="post-header flex-horizontal ">
                    <div class="post-header__img ">
                        <img src="images/avatar-vangogh.jpg" alt="" class="round-img">
                    </div>
                    <div class="post-header__info">
                        <p class="post-header__name bold-text">Vincent van Gogh</p>
                        <p class="post-header__location">Saint-Rémy-de-Provence, France</p>
                </div>
                </div>

                <div class="post-image">
                    <img src="images/post-vangogh.jpg" alt="" class="post-img">
                </div>

                <div class="post-reactions flex-vertical">
                    <div class="flex-horizontal">
                        <img src="images/icon-heart.png" alt="">
                        <img src="images/icon-comment.png" alt="">
                        <img src="images/icon-dm.png" alt="">
                    </div>
                    <p class="bold-text">21, 292 likes</p>
                </div>

                <div class="post-content">
                    <p><span class="bold-text">Vincey1853</span> Just took a few mushrooms lol</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
